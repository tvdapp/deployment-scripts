# Reusable GitHub Actions Workflow for TVD App Deployments
# This workflow can be called from any TVD app repository
#
# Usage in your app's .github/workflows/deploy.yml:
#
# jobs:
#   deploy:
#     uses: tvdapp/deployment-scripts/.github/workflows/deploy-app.yml@main
#     with:
#       app-name: "my-app"
#       app-type: "static-web"
#       container-port: 8080
#       host-port: 3000
#     secrets: inherit

name: Deploy TVD Application

on:
  workflow_call:
    inputs:
      # Required inputs
      app-name:
        description: 'Name of the application (container name)'
        required: true
        type: string
      app-type:
        description: 'Type of application (static-web, python-api, node-api, fullstack)'
        required: true
        type: string
      environment-tier:
        description: 'Deployment tier — selects which secret namespace to use (dev → DEV_* secrets, prod → non-prefixed secrets)'
        required: false
        type: string
        default: 'prod'

      # Container configuration
      container-port:
        description: 'Port the app listens on inside container'
        required: false
        type: number
        default: 8080
      host-port:
        description: 'Port exposed on host system'
        required: false
        type: number
        default: 3000
      health-endpoint:
        description: 'Health check endpoint path'
        required: false
        type: string
        default: '/health'
      
      # Resource configuration
      # Required on purpose. These were previously optional with a '128M'/'0.5'
      # default, which silently starved every caller that did not set them --
      # a non-crashing failure (healthchecks pass, latency rots). Every app
      # must now state its own budget. See the resource-floor guard below.
      memory-limit:
        description: 'Memory limit (e.g., 512M, 1G). Host has 32G.'
        required: true
        type: string
      cpu-limit:
        description: 'CPU limit (e.g., 2 for two cores). Host has 12 cores.'
        required: true
        type: string
      
      # Deployment configuration
      health-timeout:
        description: 'Seconds to wait for health check'
        required: false
        type: number
        default: 120
      restart-policy:
        description: 'Docker restart policy'
        required: false
        type: string
        default: 'unless-stopped'
      
      # Advanced options
      dockerfile-path:
        description: 'Path to Dockerfile (relative to repository root)'
        required: false
        type: string
        default: './Dockerfile'
      build-context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      environment:
        description: 'Environment variables (JSON format)'
        required: false
        type: string
        default: '{}'
      volumes:
        description: 'Volume mounts (JSON array format)'
        required: false
        type: string
        default: '[]'
      labels:
        description: 'Docker labels (JSON format)'
        required: false
        type: string
        default: '{}'
      build-args:
        description: 'Docker build args (multiline KEY=VALUE format)'
        required: false
        type: string
        default: ''
      
      # Network and domain configuration
      domain:
        description: 'Public domain for Traefik (optional)'
        required: false
        type: string
        default: ''
      traefik-network:
        description: 'Traefik network name'
        required: false
        type: string
        default: 'traefik'
      
      # App-specific secret forwarding
      app-secret-prefix:
        description: 'Forward every repository secret whose name starts with this prefix as a container env var (the secret name IS the env var name). Lets per-app secrets live in GitHub without bespoke per-app code in this workflow — e.g. "MYAPP_" forwards MYAPP_DB_URL, MYAPP_API_KEY, etc. Empty (default) = no forwarding.'
        required: false
        type: string
        default: ''

      # Healthcheck override
      use-image-healthcheck:
        description: 'When true, omit `--health-cmd` / `--health-*` flags from `docker run` and let the image''s own HEALTHCHECK directive govern health probes. Use this for images that ship a custom HEALTHCHECK (e.g. a `python urllib` probe) and do NOT have `wget` installed — slim base images that strip wget will otherwise fail every probe with `/bin/sh: wget: not found`. Default false preserves the wget-based override for backward compatibility with apps that rely on it.'
        required: false
        type: boolean
        default: false

      # Cleanup configuration
      keep-images:
        description: 'Number of old images to keep'
        required: false
        type: number
        default: 3

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate resource budget
        env:
          MEM_LIMIT: ${{ inputs.memory-limit }}
          CPU_LIMIT: ${{ inputs.cpu-limit }}
          APP_TYPE: ${{ inputs.app-type }}
        run: |
          echo "🔍 Validating resource budget: ${MEM_LIMIT} memory, ${CPU_LIMIT} CPU"

          # Normalise a docker-style size (128M, 1G, 91.16MiB, or bare bytes)
          # to whole MiB. awk rather than bash ${v^^} so this does not depend
          # on the runner's bash being >= 4.
          to_mib() {
            awk -v v="$1" 'BEGIN {
              n = v; gsub(/[^0-9.]/, "", n)
              u = v; gsub(/[0-9.[:space:]]/, "", u); u = toupper(u)
              f["B"] = 1/1048576
              f["K"] = 1/1024; f["KB"] = 1/1024; f["KIB"] = 1/1024
              f["M"] = 1; f["MB"] = 1; f["MIB"] = 1
              f["G"] = 1024; f["GB"] = 1024; f["GIB"] = 1024
              if (n == "") { print 0; exit }
              if (u == "") { printf "%d\n", n / 1048576; exit }
              printf "%d\n", n * (u in f ? f[u] : 0)
            }'
          }

          MEM_MIB=$(to_mib "$MEM_LIMIT")
          if [[ "$MEM_MIB" -eq 0 ]]; then
            echo "❌ Could not parse memory-limit '${MEM_LIMIT}'. Use a docker size like 512M or 1G."
            exit 1
          fi

          # Floors are per runtime. A managed runtime with a JIT and a GC needs
          # headroom for its heap *and* enough left over for the kernel to keep
          # a page cache; at the cgroup limit the cache is evicted to ~0 and
          # every code page is re-read from disk (see commit abc6085).
          case "$APP_TYPE" in
            node-api|nextjs|node) FLOOR=512 ;;
            python-api)           FLOOR=512 ;;
            static-web|static)    FLOOR=64  ;;
            *)                    FLOOR=256 ;;
          esac

          if [[ "$MEM_MIB" -lt "$FLOOR" ]]; then
            echo "❌ memory-limit ${MEM_LIMIT} (${MEM_MIB} MiB) is below the ${FLOOR} MiB floor for app-type '${APP_TYPE}'."
            echo "   Raise it, or if this app genuinely runs in less, widen the floor here deliberately."
            exit 1
          fi

          # 0.5 CPU throttles SSR/request bursts hard even when average use is
          # near zero, so warn rather than pass silently.
          if awk "BEGIN{exit !(${CPU_LIMIT} < 1)}"; then
            echo "⚠️ cpu-limit ${CPU_LIMIT} is under one core -- request bursts will be throttled."
          fi

          echo "✅ Resource budget OK (floor for '${APP_TYPE}' is ${FLOOR} MiB)"

      - name: Validate required files
        run: |
          echo "🔍 Validating application files for type: ${{ inputs.app-type }}"
          
          # Check for Dockerfile
          if [[ ! -f "${{ inputs.dockerfile-path }}" ]]; then
            echo "❌ Dockerfile not found at: ${{ inputs.dockerfile-path }}"
            exit 1
          fi
          echo "✅ Dockerfile exists"
          
          # Type-specific validation
          case "${{ inputs.app-type }}" in
            "static-web")
              if [[ ! -f "index.html" ]]; then
                echo "❌ index.html missing for static-web app"
                exit 1
              fi
              echo "✅ Static web files validated"
              ;;
            "python-api")
              if [[ ! -f "requirements.txt" ]] && [[ ! -f "pyproject.toml" ]]; then
                echo "❌ requirements.txt or pyproject.toml missing for Python app"
                exit 1
              fi
              echo "✅ Python dependencies file found"
              ;;
            "node-api")
              if [[ ! -f "package.json" ]]; then
                echo "❌ package.json missing for Node.js app"
                exit 1
              fi
              echo "✅ Node.js package.json found"
              ;;
            "fullstack")
              echo "✅ Full-stack app validation (custom validation should be added per app)"
              ;;
            *)
              echo "⚠️ Unknown app type: ${{ inputs.app-type }}, skipping specific validation"
              ;;
          esac

      - name: Validate Docker build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          echo "🐳 Testing Docker build..."
          BUILD_ARGS=""
          if [[ -n "${{ inputs.build-args }}" ]]; then
            while IFS= read -r line; do
              [[ -n "$line" ]] && BUILD_ARGS="$BUILD_ARGS --build-arg $line"
            done <<< "${{ inputs.build-args }}"
          fi
          [[ -n "$SENTRY_DSN" ]] && BUILD_ARGS="$BUILD_ARGS --build-arg NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN"
          [[ -n "$SENTRY_AUTH_TOKEN" ]] && BUILD_ARGS="$BUILD_ARGS --build-arg SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
          [[ -n "$SENTRY_ORG" ]] && BUILD_ARGS="$BUILD_ARGS --build-arg SENTRY_ORG=$SENTRY_ORG"
          [[ -n "$SENTRY_PROJECT" ]] && BUILD_ARGS="$BUILD_ARGS --build-arg SENTRY_PROJECT=$SENTRY_PROJECT"
          docker build -f "${{ inputs.dockerfile-path }}" $BUILD_ARGS -t "${{ inputs.app-name }}-test" "${{ inputs.build-context }}"
          echo "✅ Docker build successful"
          
          # Clean up test image
          docker rmi "${{ inputs.app-name }}-test" || true

  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: [validate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up deployment variables
        id: vars
        run: |
          IMAGE_NAME="${{ inputs.app-name }}-prod"
          echo "image-name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "container-name=${{ inputs.app-name }}" >> $GITHUB_OUTPUT
          
          # Parse JSON inputs safely
          echo '${{ inputs.environment }}' > env.json
          echo '${{ inputs.volumes }}' > volumes.json
          echo '${{ inputs.labels }}' > labels.json
          
          echo "📋 Deployment configuration:"
          echo "  App: ${{ inputs.app-name }}"
          echo "  Type: ${{ inputs.app-type }}"
          echo "  Image: $IMAGE_NAME"
          echo "  Ports: ${{ inputs.host-port }} → ${{ inputs.container-port }}"
          echo "  Health: ${{ inputs.health-endpoint }}"
          echo "  Memory: ${{ inputs.memory-limit }}"
          echo "  CPU: ${{ inputs.cpu-limit }}"

      - name: Build Docker image
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          echo "🔨 Building Docker image: ${{ steps.vars.outputs.image-name }}:latest"
          BUILD_ARGS=""
          if [[ -n "${{ inputs.build-args }}" ]]; then
            while IFS= read -r line; do
              [[ -n "$line" ]] && BUILD_ARGS="$BUILD_ARGS --build-arg $line"
            done <<< "${{ inputs.build-args }}"
          fi
          # Auto-forward Sentry build args from secrets
          [[ -n "$SENTRY_DSN" ]] && BUILD_ARGS="$BUILD_ARGS --build-arg NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN"
          [[ -n "$SENTRY_AUTH_TOKEN" ]] && BUILD_ARGS="$BUILD_ARGS --build-arg SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
          [[ -n "$SENTRY_ORG" ]] && BUILD_ARGS="$BUILD_ARGS --build-arg SENTRY_ORG=$SENTRY_ORG"
          [[ -n "$SENTRY_PROJECT" ]] && BUILD_ARGS="$BUILD_ARGS --build-arg SENTRY_PROJECT=$SENTRY_PROJECT"
          docker build \
            -f "${{ inputs.dockerfile-path }}" \
            $BUILD_ARGS \
            -t "${{ steps.vars.outputs.image-name }}:latest" \
            "${{ inputs.build-context }}"
          echo "✅ Docker image built successfully"

      - name: Stop and remove existing container
        run: |
          echo "🔍 Checking for existing container: ${{ steps.vars.outputs.container-name }}"
          
          if docker ps -a --format "table {{.Names}}" | grep -q "^${{ steps.vars.outputs.container-name }}$"; then
            echo "⚠️ Existing container found, removing..."
            docker stop "${{ steps.vars.outputs.container-name }}" 2>/dev/null || true
            docker rm "${{ steps.vars.outputs.container-name }}" 2>/dev/null || true
            echo "✅ Old container removed"
          else
            echo "ℹ️ No existing container found"
          fi

      - name: Prepare container files
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.environment-tier == 'dev' && secrets.DEV_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          # Labels file
          : > container-labels.txt
          if [[ -n "${{ inputs.domain }}" ]]; then
            cat >> container-labels.txt <<LABELS
          traefik.enable=true
          traefik.docker.network=${{ inputs.traefik-network }}
          traefik.http.routers.${{ inputs.app-name }}.rule=Host(\`${{ inputs.domain }}\`)
          traefik.http.routers.${{ inputs.app-name }}.entrypoints=websecure
          traefik.http.routers.${{ inputs.app-name }}.tls.certresolver=letsencrypt
          traefik.http.services.${{ inputs.app-name }}.loadbalancer.server.port=${{ inputs.container-port }}
          LABELS
            echo "🌐 Traefik configured for domain: ${{ inputs.domain }}"
          fi

          # Env file (secrets + custom env vars)
          : > container-env.txt
          if [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> container-env.txt
            echo "🔐 Forwarding secret: SUPABASE_SERVICE_ROLE_KEY"
          fi
          if [[ -n "$SENTRY_DSN" ]]; then
            echo "SENTRY_DSN=$SENTRY_DSN" >> container-env.txt
            echo "🔐 Forwarding secret: SENTRY_DSN"
          fi
          if [[ -s env.json ]] && [[ "$(cat env.json)" != "{}" ]]; then
            jq -r 'to_entries[] | "\(.key)=\(.value)"' env.json >> container-env.txt 2>/dev/null || true
          fi

          # Forward every secret whose name starts with `app-secret-prefix` as
          # a container env var (secret name IS the env var name). Lets callers
          # keep per-app secrets in their GitHub repo without bespoke per-app
          # code in this reusable workflow. ${{ secrets.X }} cannot be used in
          # `with:` arguments to reusable workflows (GitHub Actions limitation),
          # so this resolution has to happen here, in a `run:` context that has
          # access to `toJSON(secrets)`.
          if [[ -n "${{ inputs.app-secret-prefix }}" ]]; then
            FORWARDED_COUNT=$(echo "$ALL_SECRETS_JSON" | jq -r --arg p "${{ inputs.app-secret-prefix }}" '
              to_entries
              | map(select(.key | startswith($p)))
              | length
            ')
            if [[ "$FORWARDED_COUNT" -gt 0 ]]; then
              echo "$ALL_SECRETS_JSON" | jq -r --arg p "${{ inputs.app-secret-prefix }}" '
                to_entries[]
                | select(.key | startswith($p))
                | "\(.key)=\(.value)"
              ' >> container-env.txt
              echo "🔐 Forwarded $FORWARDED_COUNT secret(s) matching prefix: ${{ inputs.app-secret-prefix }}"
            else
              echo "ℹ️ app-secret-prefix is set (${{ inputs.app-secret-prefix }}) but no secrets match it"
            fi
          fi

      - name: Start new container
        run: |
          echo "🚀 Starting new container: ${{ steps.vars.outputs.container-name }}"

          # Translate the `volumes:` workflow input (JSON array of
          # {source, target, read_only}) into `-v src:tgt[:ro]` docker flags.
          # Mirrors the parse_volumes() logic in deploy.sh — the reusable
          # workflow had been parsing the input but never applying it (the
          # `volumes:` parameter was effectively a no-op until this block).
          VOLUME_ARGS=""
          if [[ -s volumes.json ]] && [[ "$(cat volumes.json)" != "[]" ]]; then
            while IFS= read -r vol; do
              [[ -z "$vol" ]] && continue
              vsrc=$(echo "$vol" | jq -r '.source // empty')
              vtgt=$(echo "$vol" | jq -r '.target // empty')
              vro=$(echo "$vol" | jq -r '.read_only // false')
              if [[ -z "$vsrc" ]] || [[ -z "$vtgt" ]]; then
                echo "⚠️ Skipping malformed volume entry (missing source or target): $vol"
                continue
              fi
              mount_opt=""
              [[ "$vro" == "true" ]] && mount_opt=":ro"
              VOLUME_ARGS="$VOLUME_ARGS -v ${vsrc}:${vtgt}${mount_opt}"
              echo "📦 Volume: ${vsrc} → ${vtgt}${mount_opt}"
            done < <(jq -c '.[]' volumes.json)
          fi

          # Healthcheck flags. When `use-image-healthcheck: true` (caller opt-in),
          # omit the --health-* override so Docker falls back to the image's own
          # HEALTHCHECK directive (set in the Dockerfile). Use for slim images
          # that ship a Python or otherwise wget-less healthcheck — the default
          # override below would fail every probe with `wget: not found`.
          HEALTH_FLAGS=()
          if [[ "${{ inputs.use-image-healthcheck }}" != "true" ]]; then
            HEALTH_FLAGS=(
              --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:${{ inputs.container-port }}${{ inputs.health-endpoint }} || exit 1"
              --health-interval=30s
              --health-timeout=10s
              --health-retries=3
              --health-start-period=40s
            )
            echo "🩺 Using deploy-app default wget-based healthcheck"
          else
            echo "🩺 use-image-healthcheck=true — relying on the image's own HEALTHCHECK directive"
          fi

          docker run -d \
            --name "${{ steps.vars.outputs.container-name }}" \
            --restart "${{ inputs.restart-policy }}" \
            -p "${{ inputs.host-port }}:${{ inputs.container-port }}" \
            --memory "${{ inputs.memory-limit }}" \
            --cpus "${{ inputs.cpu-limit }}" \
            "${HEALTH_FLAGS[@]}" \
            --label-file container-labels.txt \
            --env-file container-env.txt \
            $VOLUME_ARGS \
            "${{ steps.vars.outputs.image-name }}:latest"

          # Connect to Traefik network if domain is specified
          if [[ -n "${{ inputs.domain }}" ]]; then
            docker network connect "${{ inputs.traefik-network }}" "${{ steps.vars.outputs.container-name }}" 2>/dev/null || true
            echo "🌐 Connected to Traefik network: ${{ inputs.traefik-network }}"
          fi

          echo "✅ Container started successfully"

      - name: Wait for container health
        run: |
          echo "⏳ Waiting for container to become healthy (timeout: ${{ inputs.health-timeout }}s)..."
          
          timeout "${{ inputs.health-timeout }}" bash -c '
            while true; do
              status=$(docker inspect --format="{{.State.Health.Status}}" "${{ steps.vars.outputs.container-name }}" 2>/dev/null || echo "unknown")
              case $status in
                "healthy")
                  echo "✅ Container is healthy!"
                  exit 0
                  ;;
                "unhealthy")
                  echo "❌ Container is unhealthy!"
                  exit 1
                  ;;
                "starting"|"unknown")
                  echo "⌛ Container health: $status"
                  sleep 5
                  ;;
                *)
                  echo "⚠️ Unknown health status: $status"
                  sleep 5
                  ;;
              esac
            done
          ' || {
            echo "⚠️ Health check timeout"
            HEALTH_STATUS=$(docker inspect --format="{{.State.Health.Status}}" "${{ steps.vars.outputs.container-name }}" 2>/dev/null || echo "unknown")
            echo "Final health status: $HEALTH_STATUS"
          }

      - name: Test HTTP endpoint
        run: |
          echo "🌐 Testing HTTP endpoint: http://localhost:${{ inputs.host-port }}${{ inputs.health-endpoint }}"
          
          timeout 60 bash -c '
            until curl -sf "http://localhost:${{ inputs.host-port }}${{ inputs.health-endpoint }}" >/dev/null 2>&1; do
              echo "⌛ Waiting for HTTP response..."
              sleep 3
            done
            echo "✅ HTTP endpoint is responding"
          ' || echo "⚠️ HTTP endpoint test failed (container may still be starting)"

      - name: Verify deployment
        run: |
          echo "🔍 Deployment verification:"
          echo ""
          echo "📊 Container Status:"
          docker ps --filter name="${{ steps.vars.outputs.container-name }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || echo "❌ No container found"
          
          echo ""
          HEALTH_STATUS=$(docker inspect --format="{{.State.Health.Status}}" "${{ steps.vars.outputs.container-name }}" 2>/dev/null || echo "unknown")
          echo "🏥 Health Status: $HEALTH_STATUS"
          
          echo ""
          echo "🌐 Access Points:"
          echo "   📱 Local: http://localhost:${{ inputs.host-port }}"
          echo "   🏥 Health: http://localhost:${{ inputs.host-port }}${{ inputs.health-endpoint }}"
          
          if [[ -n "${{ inputs.domain }}" ]]; then
            echo "   🌍 Public: https://${{ inputs.domain }}"
          fi
          
          echo ""
          if docker ps --filter name="${{ steps.vars.outputs.container-name }}" | grep -q "${{ steps.vars.outputs.container-name }}"; then
            echo "🎉 Deployment completed successfully!"
          else
            echo "❌ Deployment failed - container not running"
            exit 1
          fi

      - name: Check resource headroom
        env:
          CONTAINER: ${{ steps.vars.outputs.container-name }}
        run: |
          echo "📏 Checking resource headroom for ${CONTAINER}..."

          # Let the app settle so this measures a warm process, not boot.
          sleep 20

          # Normalise a docker-style size (128M, 1G, 91.16MiB, or bare bytes)
          # to whole MiB. awk rather than bash ${v^^} so this does not depend
          # on the runner's bash being >= 4.
          to_mib() {
            awk -v v="$1" 'BEGIN {
              n = v; gsub(/[^0-9.]/, "", n)
              u = v; gsub(/[0-9.[:space:]]/, "", u); u = toupper(u)
              f["B"] = 1/1048576
              f["K"] = 1/1024; f["KB"] = 1/1024; f["KIB"] = 1/1024
              f["M"] = 1; f["MB"] = 1; f["MIB"] = 1
              f["G"] = 1024; f["GB"] = 1024; f["GIB"] = 1024
              if (n == "") { print 0; exit }
              if (u == "") { printf "%d\n", n / 1048576; exit }
              printf "%d\n", n * (u in f ? f[u] : 0)
            }'
          }

          USAGE=$(docker stats --no-stream --format '{{.MemUsage}}' "$CONTAINER")
          USED_MIB=$(to_mib "$(echo "$USAGE" | awk -F' / ' '{print $1}')")
          LIMIT_MIB=$(to_mib "$(echo "$USAGE" | awk -F' / ' '{print $2}')")

          echo "   Using ${USED_MIB} MiB of ${LIMIT_MIB} MiB"

          if [[ "$LIMIT_MIB" -le 0 ]]; then
            echo "ℹ️ No memory limit set -- nothing to check."
            exit 0
          fi

          PCT=$(( USED_MIB * 100 / LIMIT_MIB ))
          echo "   Headroom used: ${PCT}%"

          # A warm container above 80% of its cap will evict its own page cache
          # and degrade steadily over the days after a deploy, without ever
          # crashing or failing a healthcheck. Surface it at deploy time.
          if [[ "$PCT" -ge 90 ]]; then
            echo "::error::${CONTAINER} is at ${PCT}% of its ${LIMIT_MIB} MiB limit right after deploy. Raise memory-limit -- it will thrash the page cache as traffic accrues."
            exit 1
          elif [[ "$PCT" -ge 80 ]]; then
            echo "::warning::${CONTAINER} is at ${PCT}% of its ${LIMIT_MIB} MiB limit right after deploy. Consider raising memory-limit."
          else
            echo "✅ Healthy headroom (${PCT}% of limit)"
          fi


      - name: Cleanup old images
        run: |
          echo "🧹 Cleaning up old images (keeping latest ${{ inputs.keep-images }})..."
          
          # Keep only the latest N images
          IMAGES_TO_REMOVE=$(docker images "${{ steps.vars.outputs.image-name }}" --format "table {{.ID}}\t{{.CreatedAt}}" | \
                           tail -n +2 | \
                           sort -k2 -r | \
                           tail -n +$((${{ inputs.keep-images }} + 1)) | \
                           awk '{print $1}')
          
          if [[ -n "$IMAGES_TO_REMOVE" ]]; then
            echo "$IMAGES_TO_REMOVE" | xargs -r docker rmi 2>/dev/null || true
            echo "✅ Old images cleaned up"
          else
            echo "ℹ️ No old images to clean up"
          fi
          
          # Remove dangling images
          DANGLING=$(docker images -f "dangling=true" -q)
          if [[ -n "$DANGLING" ]]; then
            echo "$DANGLING" | xargs -r docker rmi 2>/dev/null || true
            echo "✅ Dangling images removed"
          fi

          # BuildKit's cache is a SEPARATE store -- docker rmi and
          # `docker image prune` cannot reach it. Without this the cache grew
          # unbounded to 182 GiB / 1410 entries over ~8 months on the NUC,
          # while this cleanup step reported success every time. A weekly cron
          # on the host backs this up in case deploys go quiet.
          echo "🧹 Pruning BuildKit cache older than 7 days..."
          docker builder prune --filter until=168h --force 2>/dev/null || true
          
          echo "🏁 Deployment pipeline completed successfully!"

      # Clean up temporary files
      - name: Cleanup
        if: always()
        run: |
          rm -f env.json volumes.json labels.json container-labels.txt container-env.txt
